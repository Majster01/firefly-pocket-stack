# firefly-pocket-stack — Firefly III + Firefly Pocket + Data Importer + Category suggester
#
# Only `caddy` publishes ports. Everything else is reachable solely on the
# internal `fireflyx` network — in particular Postgres and the category suggester
# have no route in from the internet at all.
#
# Image tags are pinned deliberately. Firefly III runs database migrations on
# boot, so an unattended version jump during a routine `docker compose pull`
# is how people lose data. Updating is a deliberate act — see README.
#
# Merging into master deploys this file (scripts/deploy.sh, README "Deploying").
# Upstream images are bumped by Renovate PRs; the two forks' images by
# .github/workflows/pin.yml when the fork's deploy branch moves (Firefly Pocket's too).

name: fireflyx

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

networks:
  fireflyx:
    name: fireflyx
  # Only Dozzle and the Docker socket proxy share this one, and it has no route
  # out (internal), so the proxy can neither be reached from nor reach anything else.
  dozzle_socket:
    name: dozzle_socket
    internal: true
  # Dozzle's own network, only so its port can be published on the host's
  # loopback (an internal network cannot publish one). Keeping it off
  # `fireflyx` means a compromised Dozzle cannot reach the apps or Postgres.
  dozzle_ui:
    name: dozzle_ui
  # The console's, shared with Caddy only, so a compromised console reaches
  # Caddy and the internet (it looks names up), not the apps or Postgres.
  console:
    name: fireflyx_console

volumes:
  caddy_data:
  caddy_config:
  db_data:
  firefly_upload:
  importer_render:
  suggester_data:

services:
  # ---------------------------------------------------------------- caddy ---
  # Terminates TLS for every host and is the only thing bound to the host.
  # Certificates are obtained from Let's Encrypt on first boot, so DNS must
  # already resolve to this machine or startup will fail to get a cert.
  caddy:
    image: caddy:2.11.7-alpine
    container_name: fireflyx-caddy
    restart: unless-stopped
    logging: *default-logging
    networks: [fireflyx, console]
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./legal:/srv/legal:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in .env}
      # Each host is <name>.DOMAIN unless .env sets it on its own, so a server
      # with all four set needs no DOMAIN. The same defaults are written out
      # wherever a URL needs a host below, and in scripts/lib.sh, which is what
      # refuses to go on when a name and DOMAIN are both missing. Compose
      # cannot: some versions evaluate a ${DOMAIN:?...} inside a default even
      # when the name is set.
      FIREFLY_HOSTNAME: ${FIREFLY_HOSTNAME:-firefly.${DOMAIN:-}}
      NEXT_HOSTNAME: ${NEXT_HOSTNAME:-app.${DOMAIN:-}}
      IMPORT_HOSTNAME: ${IMPORT_HOSTNAME:-import.${DOMAIN:-}}
      LEGAL_HOSTNAME: ${LEGAL_HOSTNAME:-legal.${DOMAIN:-}}
      # The console's. A server with no DOMAIN has none until it is set, and
      # Caddy serves admin.localhost instead: its own certificate, no ACME.
      ADMIN_HOSTNAME: ${ADMIN_HOSTNAME:-admin.${DOMAIN:-localhost}}
      # The setup gate (Caddyfile): "done" once the importer has its Firefly III
      # token, which setup makes right after the account. Until then every host
      # but the console's sends the browser to the console. A change recreates
      # Caddy, as its environment changed.
      FIREFLY_POCKET_SETUP: ${IMPORTER_FIREFLY_TOKEN:+done}
      IMPORT_AUTH_USER: ${IMPORT_AUTH_USER:?set IMPORT_AUTH_USER in .env}
      IMPORT_AUTH_HASH: ${IMPORT_AUTH_HASH:?run scripts/gen-secrets.sh}
      # Filled into the legal pages (compose/legal/*.html are Caddy templates).
      # The contact address falls back to SITE_OWNER, the site name to the host.
      LEGAL_OWNER_NAME: ${LEGAL_OWNER_NAME:-}
      LEGAL_CONTACT_EMAIL: ${LEGAL_CONTACT_EMAIL:-${SITE_OWNER:?set SITE_OWNER in .env}}
      LEGAL_SITE_NAME: ${LEGAL_SITE_NAME:-}
      # Empty in .env = Let's Encrypt production. Set it to the staging
      # directory URL while testing a new deploy; see the Caddyfile.
      #
      # The production URL is defaulted HERE rather than in the Caddyfile on
      # purpose. Caddy's {$VAR:default} only falls back when the variable is
      # UNSET; an empty-but-set value yields an empty CA and breaks issuance
      # silently. Compose's :- treats empty as unset, so this always passes a
      # real URL through. Verified with `caddy adapt`.
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}
    depends_on:
      - app
      - next
      - importer
      - console

  # -------------------------------------------------------------- console ---
  # The Firefly Pocket Console on admin.<domain> (Setup UI). Until Firefly III
  # has its account it is all this server shows. It asks for the setup code
  # that `scripts/firefly-pocket setup web` prints until setup is finished, which
  # removes the code; after that it only says where things are. Whether Firefly
  # III has its account it reads from the agent's status, not from here, so
  # making the account does not start it again and end your session. Its source
  # is services/console, run on the stock image, mounted read-only.
  #
  # It holds no secret but that code, and cannot touch Docker or the settings.
  # It can add a request to console/inbox, which it cannot list, and read
  # console/status; the host agent checks each request as `config set` would,
  # applies it and writes the status (scripts/console.sh, which makes both
  # directories before this starts). Another user than the agent's, on a
  # read-only root, with no capability, on Caddy's network only.
  console:
    image: python:3.13.15-slim
    container_name: fireflyx-console
    restart: unless-stopped
    logging: *default-logging
    networks: [console]
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /app
    command: ["python", "-I", "-B", "-u", "/app/console.py"]
    volumes:
      - ../services/console:/app:ro
      - ./console/inbox:/inbox
      - ./console/status:/status:ro
    environment:
      SETUP_CODE: ${SETUP_CODE:-}
      # Which certificates it checks: those of Let's Encrypt production only.
      ACME_CA: ${ACME_CA:-https://acme-v02.api.letsencrypt.org/directory}

  # ------------------------------------------------------------------- db ---
  # One database per app on one instance, each owned by its own least-privilege role.
  # NOTE: initdb/ scripts run ONLY when db_data is empty (first boot ever).
  # Changing them later has no effect on an existing volume.
  db:
    image: postgres:17.11-alpine
    container_name: fireflyx-db
    restart: unless-stopped
    logging: *default-logging
    networks: [fireflyx]
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:?run scripts/gen-secrets.sh}
      POSTGRES_DB: postgres
      FIREFLY_DB_PASSWORD: ${FIREFLY_DB_PASSWORD:?run scripts/gen-secrets.sh}
      IMPORTER_DB_PASSWORD: ${IMPORTER_DB_PASSWORD:?run scripts/gen-secrets.sh}
      NEXT_DB_PASSWORD: ${NEXT_DB_PASSWORD:?run scripts/gen-secrets.sh}
      TZ: ${TZ:-Etc/UTC}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ------------------------------------------------------------- firefly ---
  # The source of truth. Every other service is an API client of this one.
  app:
    image: fireflyiii/core:version-6.7.9
    container_name: fireflyx-app
    restart: unless-stopped
    logging: *default-logging
    networks: [fireflyx]
    volumes:
      - firefly_upload:/var/www/html/storage/upload
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      # Must be EXACTLY 32 characters or Firefly III refuses to boot.
      APP_KEY: ${FIREFLY_APP_KEY:?run scripts/gen-secrets.sh}
      # Wrong value here breaks redirects, OAuth and the PAT flow.
      APP_URL: https://${FIREFLY_HOSTNAME:-firefly.${DOMAIN:-}}
      TZ: ${TZ:-Etc/UTC}
      # Behind Caddy: trust the forwarded proto/host headers.
      TRUSTED_PROXIES: "**"
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: firefly
      DB_USERNAME: firefly
      DB_PASSWORD: ${FIREFLY_DB_PASSWORD}
      SITE_OWNER: ${SITE_OWNER:?set SITE_OWNER in .env}
      # Must be EXACTLY 32 characters. Authenticates the nightly cron call.
      STATIC_CRON_TOKEN: ${STATIC_CRON_TOKEN:?run scripts/gen-secrets.sh}
      #
      # There is deliberately NO registration flag here. Firefly III 6.x has
      # no ALLOW_REGISTRATION setting — it closes registration by itself.
      # `single_user_mode` lives in the database, defaults to true, and
      # RegisterController::allowedToRegister() refuses once any user exists:
      #     if (single_user_mode && userCount > 0 && guard === 'web')
      # Verified empirically: after the first account, /register renders
      # "Registration is currently not available" with no form, and a second
      # signup is rejected. Nothing to configure.
      # Upstream default. Firefly III ships no `sessions` table migration, so
      # SESSION_DRIVER=database would break login. Consequence: recreating
      # this container logs you out. That is expected.
      # Webhooks are OFF by default in Firefly III, and nothing in this stack
      # uses them since the AI categorizer webhook was replaced by the
      # category suggester (a nightly job that only reads the API).
      #
      # Caveat: this env var only seeds the DEFAULT for a fresh database
      # ("no longer used, only for default" per config/firefly.php). On an
      # existing instance the live value lives in the `configuration` table
      # and must be changed through the API instead:
      #   PUT /api/v1/configuration/configuration.allow_webhooks {"value":false}
      ALLOW_WEBHOOKS: "false"
      SESSION_DRIVER: file
      CACHE_DRIVER: file
      LOG_CHANNEL: stack
      APP_LOG_LEVEL: notice
    depends_on:
      db:
        condition: service_healthy

  # ---------------------------------------------------------------- next ---
  # Firefly Pocket: the web app and its API in one image (nginx + php-fpm, a
  # bundled redis for its queue and cache), on port 80, NOT 8080. Its own
  # database, firefly_next, owned by its own role. Migrations run on start.
  #
  # Built by Majster01/firefly-pocket's CI (branch main) and tagged
  # sha-<commit>. A merge into its main pins the new tag here through
  # .github/workflows/pin.yml, which deploys it.
  next:
    image: ghcr.io/majster01/firefly-pocket:sha-3fa7cb6
    container_name: fireflyx-next
    restart: unless-stopped
    logging: *default-logging
    networks: [fireflyx]
    environment:
      APP_KEY: ${NEXT_APP_KEY:?run scripts/gen-secrets.sh}
      APP_URL: https://${NEXT_HOSTNAME:-app.${DOMAIN:-}}
      # Firefly III on this network, as the importer and the suggester reach
      # it, not out through Caddy and back. Only Pocket's server calls it: the
      # browser talks to Pocket's own /api, never to Firefly III.
      FIREFLY_URL: http://app:8080
      # Also the timezone the cache of Firefly answers expires at midnight in.
      TZ: ${TZ:-Etc/UTC}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: firefly_next
      DB_USERNAME: next
      DB_PASSWORD: ${NEXT_DB_PASSWORD:?run scripts/gen-secrets.sh}
      # Bank connections: the importer fork's internal API (Caddy refuses it
      # from outside).
      IMPORTER_API_URL: http://importer:8080/api/fireflyx/v1
      IMPORTER_API_TOKEN: ${FIREFLYX_API_TOKEN:?run scripts/gen-secrets.sh}
      # Web Push for the installed PWA. The receiver, POST /api/internal/notify,
      # has its own token, which this stack's alert senders use. Without the
      # VAPID keys it answers 503 and the senders fall back to ntfy alone
      # (README "Push alerts"). Caddy refuses /api/internal/* from outside.
      NOTIFY_API_TOKEN: ${NEXT_NOTIFY_TOKEN:?run scripts/gen-secrets.sh}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      # Optional: a Firefly III token of your user that refetches Home after a
      # change, so the first open finds it cached (Firefly Pocket README
      # "Caching"). Empty = off. Firefly's webhooks are off here, so changes
      # made outside Pocket reach its cache only through the TTL.
      WARMUP_FIREFLY_TOKEN: ${NEXT_WARMUP_FIREFLY_TOKEN:-}
      # Sign in with Firefly III (Setup UI step 11): the browser signs in on
      # Firefly III's own login, at its public address, and Pocket's server
      # swaps the code for a token on this network. Offered only once setup has
      # registered Pocket's public client (scripts/account.sh, pocket_client).
      FIREFLY_PUBLIC_URL: https://${FIREFLY_HOSTNAME:-firefly.${DOMAIN:-}}
      FIREFLY_CLIENT_ID: ${POCKET_CLIENT_ID:-}
    depends_on:
      db:
        condition: service_healthy

  # ------------------------------------------------------------ importer ---
  # Publicly reachable (behind basic auth) because the Enable Banking OAuth
  # redirect lands in your browser and must reach it over HTTPS.
  # The nightly /autoimport trigger does NOT come through Caddy — cron calls
  # it on this internal network, so basic auth never gets in the way.
  importer:
    # Our fork (Majster01/data-importer, branch fireflyx): the official
    # image plus bank connections in Postgres, the nightly render and the API
    # Firefly Pocket uses. See docs/design/bank-link.md. Built by the fork's CI and
    # tagged <upstream version>-<commit>; a merge into its fireflyx branch pins
    # the new tag here through .github/workflows/pin.yml, which deploys it
    # (after a backup and restore test, as for every image that migrates).
    image: ghcr.io/majster01/data-importer:2.3.5-0e512de
    container_name: fireflyx-importer
    restart: unless-stopped
    logging: *default-logging
    networks: [fireflyx]
    volumes:
      # One <name>.json per bank connection, rewritten by `fireflyx:render`
      # from the database right before every nightly /autoimport. Only the
      # container touches it (as www-data); read it with
      #   docker compose exec importer php artisan fireflyx:render --dry-run
      - importer_render:/import
      # The import settings every connection shares (config/importer-base.json).
      # The directory, not the file: deploys replace the file by rename, and a
      # single-file bind mount would keep showing the old one.
      - ../config:/fireflyx/config:ro
      - ./secrets/eb:/secrets/eb:ro
    environment:
      # Internal hop to Firefly III; VANITY_URL is what it renders in links.
      FIREFLY_III_URL: http://app:8080
      VANITY_URL: https://${FIREFLY_HOSTNAME:-firefly.${DOMAIN:-}}
      FIREFLY_III_ACCESS_TOKEN: ${IMPORTER_FIREFLY_TOKEN}
      TZ: ${TZ:-Etc/UTC}
      TRUSTED_PROXIES: "**"
      # Enable Banking (EU/EEA PSD2).
      #
      # ENABLE_BANKING_PRIVATE_KEY must be the BASE64 BODY of the PEM: the key
      # with the -----BEGIN/END----- armour stripped and all newlines removed,
      # on one line. SecretManager::… detects base64 and rebuilds the PEM
      # itself, so this round-trips losslessly and avoids every newline and
      # quoting problem.
      #
      # Do NOT use a path or file:// URL. The importer runs the value through
      # filter_var(FILTER_VALIDATE_URL) and, on a match, logs
      #   "Private key is an URL" / "PLEASE DO NOT PROVIDE PATHS OR URLS."
      # then fails validation with a bare {"result":"NOK"} in the UI. Various
      # docs suggest file:// — it does not work in 2.3.4.
      #
      # Regenerate from a PEM with:
      #   grep -v -- ----- private.pem | tr -d '\n'
      ENABLE_BANKING_APP_ID: ${ENABLE_BANKING_APP_ID}
      ENABLE_BANKING_PRIVATE_KEY: ${ENABLE_BANKING_PRIVATE_KEY}
      # Unattended import: cron POSTs here with this secret.
      CAN_POST_AUTOIMPORT: "true"
      CAN_POST_FILES: "false"
      AUTO_IMPORT_SECRET: ${AUTO_IMPORT_SECRET:?run scripts/gen-secrets.sh}
      # The /autoimport caller MUST pass ?directory=/import. Without it the
      # controller falls back to realpath('./') — the container's working
      # directory — which fails this allowlist with "Not allowed to import
      # from this path." See scripts/nightly.sh.
      IMPORT_DIR_ALLOWLIST: /import
      # Each nightly run deliberately re-asks the bank for an overlapping
      # window (IMPORT_LOOKBACK_DAYS) so late-booked transactions are not
      # missed. Without this, every duplicate that gets discarded is logged as
      # an error — which would trip the log scan in nightly.sh every night.
      IGNORE_DUPLICATE_ERRORS: "true"
      # --- Our fork ----------------------------------------------------------
      # Its own database for bank connections. APP_KEY encrypts their Enable
      # Banking sessions at rest; losing it means re-linking every bank.
      APP_KEY: ${IMPORTER_APP_KEY:?run scripts/gen-secrets.sh}
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: "5432"
      DB_DATABASE: fireflyx_importer
      DB_USERNAME: importer
      DB_PASSWORD: ${IMPORTER_DB_PASSWORD:?run scripts/gen-secrets.sh}
      # Run the fork's migrations on start (the base image waits for the
      # database first). Every other serversideup automation stays off, so
      # upstream's own boot sequence is unchanged.
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "true"
      AUTORUN_LARAVEL_OPTIMIZE: "false"
      AUTORUN_LARAVEL_CONFIG_CACHE: "false"
      AUTORUN_LARAVEL_ROUTE_CACHE: "false"
      AUTORUN_LARAVEL_VIEW_CACHE: "false"
      AUTORUN_LARAVEL_EVENT_CACHE: "false"
      AUTORUN_LARAVEL_STORAGE_LINK: "false"
      FIREFLYX_API_TOKEN: ${FIREFLYX_API_TOKEN:?run scripts/gen-secrets.sh}
      # "Import now" in Firefly Pocket asks the category suggester to look at the time
      # frame it just imported (see suggester-trigger).
      FIREFLYX_SUGGESTER_URL: http://suggester-trigger:8080
      FIREFLYX_SUGGESTER_TOKEN: ${SUGGESTER_TRIGGER_TOKEN:?run scripts/gen-secrets.sh}
      FIREFLYX_BASE_CONFIG: /fireflyx/config/importer-base.json
      # Linking or re-authenticating a bank from Firefly Pocket. Enable Banking
      # redirects only to a URL registered for the app: this one, on Firefly
      # Pocket's host, where Caddy sends the fork's ("fx-" state) callbacks to
      # the fork. Links started in the importer's own UI keep coming back to
      # its host. The user then lands back in Firefly Pocket, on its
      # /bank-connections pages — the only place the callback ever redirects
      # to.
      FIREFLY_POCKET_CALLBACK_URL: https://${NEXT_HOSTNAME:-app.${DOMAIN:-}}/eb-callback
      FIREFLY_POCKET_APP_URL: https://${NEXT_HOSTNAME:-app.${DOMAIN:-}}
      # Banks book late; duplicate detection discards the overlap.
      FIREFLYX_LOOKBACK_DAYS: ${IMPORT_LOOKBACK_DAYS:-5}
      # Per-night import history for Firefly Pocket's System status page (README).
      FIREFLYX_HISTORY_DAYS: ${FIREFLYX_HISTORY_DAYS:-180}
      FIREFLYX_EVENTS_DAYS: ${FIREFLYX_EVENTS_DAYS:-90}
      # Consent-flow trace for debugging a bank link: one "EB-TRACE" log line
      # per step. See "Debugging a bank link" in the README.
      FIREFLYX_EB_TRACE: ${FIREFLYX_EB_TRACE:-false}
      FIREFLYX_EB_TRACE_RAW: ${FIREFLYX_EB_TRACE_RAW:-false}
    depends_on:
      db:
        condition: service_healthy
      app:
        condition: service_started

  # ----------------------------------------------------------- suggester ---
  # One-shot job, not a daemon: the `jobs` profile keeps it out of `up -d`.
  # Suggests category rules for uncategorized withdrawals and writes them as
  # INACTIVE rules into the `Suggestions` rule group, where Firefly Pocket lets
  # you approve them. It never sets a category itself. Contract:
  # docs/rule-suggestions.md.
  #
  #   docker compose run --rm suggester suggest --dry-run
  #   docker compose run --rm suggester suggest --all     # backfill, any date
  #   docker compose run --rm suggester notify            # the daily digest
  #
  # Built from services/category-suggester by .github/workflows/suggester.yml
  # on every merge that changes it, tagged sha-<commit> and pinned here through
  # .github/workflows/pin.yml, like the forks: the server builds nothing. To try
  # a change locally:
  #   docker build -t firefly-pocket-suggester:dev ../services/category-suggester
  suggester:
    image: ghcr.io/majster01/firefly-pocket-suggester:sha-a6ef2c6
    profiles: [jobs]
    logging: *default-logging
    networks: [fireflyx]
    volumes:
      # SQLite: which suggestions it wrote, and which you rejected, so a
      # rejected suggestion is never made again.
      - suggester_data:/data
    environment:
      FIREFLY_URL: http://app:8080
      SUGGESTER_FIREFLY_TOKEN: ${SUGGESTER_FIREFLY_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      # Used only when SUGGESTER_MODEL is a gemini-* model.
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      SUGGESTER_MODEL: ${SUGGESTER_MODEL:-claude-haiku-5-5}
      SUGGESTER_MIN_CONFIDENCE: ${SUGGESTER_MIN_CONFIDENCE:-0.6}
      SUGGESTER_MAX_PER_RUN: ${SUGGESTER_MAX_PER_RUN:-50}
      # `notify`: the suggestions digest, linking to Firefly Pocket's suggestion list.
      # Goes to its Web Push endpoint on this network, for the devices that want it.
      NTFY_URL: ${NTFY_URL}
      NEXT_NOTIFY_URL: http://next:80/api/internal/notify
      NEXT_NOTIFY_TOKEN: ${NEXT_NOTIFY_TOKEN:?run scripts/gen-secrets.sh}
      TZ: ${TZ:-Etc/UTC}
    depends_on:
      - app

  # ------------------------------------------------- suggester-trigger ---
  # The same image, kept running so the importer can ask for a run: a manual
  # import started from Firefly Pocket ("Import now") is followed by suggestions for the
  # time frame it imported. It listens on this network only (no published port,
  # no Caddy route) and does nothing without SUGGESTER_TRIGGER_TOKEN, which
  # only the importer holds. It runs the same `suggest` as the nightly job.
  suggester-trigger:
    extends:
      service: suggester
    profiles: !reset []
    container_name: fireflyx-suggester-trigger
    restart: unless-stopped
    command: ["serve"]
    environment:
      SUGGESTER_TRIGGER_TOKEN: ${SUGGESTER_TRIGGER_TOKEN:?run scripts/gen-secrets.sh}
    depends_on:
      - app

  # ---------------------------------------------------------- socket-proxy ---
  # The only thing that touches /var/run/docker.sock for Dozzle, and it answers
  # read-only: CONTAINERS and INFO. Everything else, POST above all, stays at the
  # image's default of refused, so a compromised Dozzle cannot start, stop or
  # exec anything. Mounting the socket straight into Dozzle would be root on
  # this host.
  #
  # Read-only is NOT harmless: CONTAINERS allows every GET under /containers,
  # which includes inspect (each container's environment, i.e. every secret in
  # .env) and archive (copy any file out of a container, Postgres data included).
  # Whoever controls Dozzle can read everything. That is why Dozzle is reachable
  # only through an SSH tunnel, never from the internet.
  socket-proxy:
    image: tecnativa/docker-socket-proxy:v0.5.0
    container_name: fireflyx-socket-proxy
    restart: unless-stopped
    logging: *default-logging
    networks: [dozzle_socket]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      CONTAINERS: "1"
      INFO: "1"

  # ---------------------------------------------------------------- dozzle ---
  # Live log viewer for every container. It has no login and no Caddy route: it
  # listens on the host's loopback only, so the one way in is an SSH tunnel
  # (README "Logs (Dozzle)"):
  #   ssh -N -L 8081:127.0.0.1:8081 <server>    # then open http://localhost:8081
  # It stores nothing: it shows what Docker still holds (the 10 MB x 3 json-file
  # rotation above), so a recreated container starts with an empty log. Actions
  # and shell are off by default and stay off.
  #
  # Remote-host mode through the proxy is the documented way to run it without the
  # socket; Dozzle's docs call that mode legacy in favour of agents, but an agent
  # needs the socket itself, and a read-only mount does not limit the API.
  dozzle:
    image: amir20/dozzle:v11.4.0
    container_name: fireflyx-dozzle
    restart: unless-stopped
    logging: *default-logging
    networks: [dozzle_ui, dozzle_socket]
    # 127.0.0.1 only: never bind this to all interfaces. Docker's published
    # ports bypass a host firewall such as ufw; the Hetzner firewall would still
    # drop 8081, but the loopback address is what keeps it off the internet.
    ports:
      - "127.0.0.1:8081:8080"
    environment:
      DOZZLE_REMOTE_HOST: tcp://socket-proxy:2375|firefly-pocket
      DOZZLE_NO_ANALYTICS: "true"
      DOZZLE_RELEASE_CHECK_MODE: manual
      DOZZLE_IMAGE_CHECK_MODE: "off"
    depends_on:
      - socket-proxy
