#cloud-config
#
# First-boot configuration for the FireflyX host: a user, the repository, and
# scripts/first-boot.sh, which does the rest (Docker, the files under host/).
# The firefly-pocket.com/help/hetzner page generates the same shape for people
# who make the server by hand, with the answers scripts/first-boot.sh reads
# added; a server made with Terraform is set up over SSH (README "Set it up").
#
# NOTE: this file is rendered by Terraform's templatefile(). A literal dollar
# sign before braces must be doubled; a single one is interpolated at plan time.

timezone: ${timezone}

package_update: true
package_upgrade: true

packages:
  - ca-certificates
  - curl
  - git
  - jq

users:
  - name: ${admin_user}
    groups: [sudo]
    shell: /bin/bash
    sudo: "ALL=(ALL) NOPASSWD:ALL"
    ssh_authorized_keys:
      - ${ssh_public_key}

runcmd:
  - git clone --quiet ${repo_url} /opt/fireflyx
  - ADMIN_USER=${admin_user} /opt/fireflyx/scripts/first-boot.sh install

final_message: |
  FireflyX host ready.

  Next:
    1. Point A records for <your domain> and *.<your domain> at this machine.
    2. ssh ${admin_user}@<ip>
    3. Follow README.md "Set it up": scripts/install-deploy-agent.sh finds the
       checkout already in /opt/fireflyx.
