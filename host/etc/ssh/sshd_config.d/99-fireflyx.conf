# Key-only SSH. The Hetzner firewall already restricts who can reach port
# 22; this makes sure that even from an allowed address there is no password
# to guess. A root password Hetzner emails for a server made without an SSH
# key is therefore useless over the network; it still works on Hetzner's web
# Console.
PermitRootLogin no
PasswordAuthentication no
KbdInteractiveAuthentication no
ChallengeResponseAuthentication no
X11Forwarding no
