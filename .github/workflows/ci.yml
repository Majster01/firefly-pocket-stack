# Checks every PR into master (Release pipeline step 1). Merging into master
# deploys, so these are what a change has to pass first. Run the same commands
# locally before pushing (AGENTS.md "Checks").
#
# One check per job. Their names (shellcheck, compose, suggester, boot,
# bundle, upgrade (stable), upgrade (latest)) are what master's ruleset
# requires, so rename them only together with it.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # A pinned shellcheck rather than the runner's, so a runner image update
      # cannot fail a PR that changed nothing. Renovate moves the tag.
      - name: shellcheck every script
        env:
          SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0
        run: |
          git ls-files -z '*.sh' \
            | xargs -0 docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -x -P scripts

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # The way a new server makes its .env (README setup), so this also runs
      # gen-secrets.sh. Every value is a throwaway made for this run, including
      # the importer password it prints.
      - name: Make a compose/.env from .env.example
        run: |
          cp compose/.env.example compose/.env
          scripts/gen-secrets.sh

      - name: docker compose config
        run: docker compose --project-directory compose config -q

  suggester:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # linux/arm64 runs under QEMU: the image is published for both.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      # The tests run inside the image the server runs, built for each platform
      # it is published for.
      - name: Build the suggester image and run its tests in it
        run: scripts/suggester-test.sh

  # The whole stack from scratch, as a new server starts it, checked with the
  # deploy's own smoke test (Release pipeline step 4). On a pin PR this boots
  # the new image before it can reach the server.
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Boot the stack and run the deploy's smoke test
        run: scripts/boot-test.sh

  # The release bundle this PR would publish once merged (publish.yml), made
  # but not pushed: every image resolves to a digest, and compose accepts the
  # pinned file.
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the version counts the commits since the last release tag

      - name: Assemble the bundle
        run: |
          scripts/make-bundle.sh "$RUNNER_TEMP/bundle"
          cat "$RUNNER_TEMP/bundle/release.json"

  # A published bundle booted, then upgraded to this commit the way a deploy
  # does it, and checked again (Release pipeline step 8): from stable, what new
  # installs run, and from latest, what your server runs, so the very upgrade
  # this merge would cause there. Before the first release, stable passes with
  # a note.
  upgrade:
    name: upgrade (${{ matrix.from }})
    strategy:
      fail-fast: false
      matrix:
        from: [stable, latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Boot ${{ matrix.from }} and upgrade it to this commit
        env:
          FROM: ${{ matrix.from }}
        run: scripts/upgrade-test.sh

  # WIP, removed before review: keyless signing as publish.yml does it, on a
  # throwaway bundle in a local registry, so nothing reaches GHCR.
  sign-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    services:
      registry:
        image: registry:3
        ports: ['5000:5000']
    steps:
      - uses: sigstore/cosign-installer@v4.1.3
      - name: Sign, verify, re-tag, verify again, and refuse the wrong identity
        env:
          IMAGE: localhost:5000/firefly-pocket-stack
        run: |
          set -x
          cosign version
          mkdir "$RUNNER_TEMP/b" && echo test > "$RUNNER_TEMP/b/release.json"
          printf 'FROM scratch\nCOPY . /\n' > "$RUNNER_TEMP/Dockerfile"
          docker build -f "$RUNNER_TEMP/Dockerfile" -t "$IMAGE:sha-test" "$RUNNER_TEMP/b"
          docker push "$IMAGE:sha-test"
          digest="$(docker buildx imagetools inspect "$IMAGE:sha-test" | awk '$1 == "Digest:" { print $2; exit }')"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          cosign sign --yes "$IMAGE@$digest"
          me="https://github.com/$GITHUB_REPOSITORY/.github/workflows/ci.yml@$GITHUB_REF"
          iss=https://token.actions.githubusercontent.com
          cosign verify "$IMAGE@$digest" --certificate-identity "$me" --certificate-oidc-issuer "$iss" > /dev/null
          docker buildx imagetools create --prefer-index=false -t "$IMAGE:stable" "$IMAGE@$digest"
          cosign verify "$IMAGE:stable" --certificate-identity "$me" --certificate-oidc-issuer "$iss" > /dev/null
          if cosign verify "$IMAGE:stable" --certificate-identity "https://github.com/$GITHUB_REPOSITORY/.github/workflows/publish.yml@refs/heads/master" --certificate-oidc-issuer "$iss" > /dev/null; then
            echo "verified against the wrong identity" >&2; exit 1
          fi
          curl -fsS "http://localhost:5000/v2/firefly-pocket-stack/tags/list"
          echo "SIGN TEST OK"

  # WIP, removed before review: the forks' branches, built for both platforms
  # as their deploy workflows will, then the arm64 image started under QEMU.
  # Nothing is pushed.
  fork-arm-test:
    name: fork-arm-test (${{ matrix.repo }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - repo: Majster01/firefly-pocket
            file: Dockerfile
            args: APP_VERSION=arm-test
            check: php /var/www/html/artisan --version
          - repo: Majster01/data-importer
            file: Dockerfile.fireflyx
            args: IMPORTER_VERSION=2.3.5
            check: php -v
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          ref: claude/fireflyx-release-pipeline-3x4v74
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4
      - name: Build both platforms
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.args }}
          push: false
      - name: Start the arm64 image
        env:
          FILE: ${{ matrix.file }}
          ARGS: ${{ matrix.args }}
          CHECK: ${{ matrix.check }}
        run: |
          docker buildx build --load --platform linux/arm64 -f "$FILE" --build-arg "$ARGS" -t arm-test .
          docker image inspect arm-test --format '{{.Os}}/{{.Architecture}}'
          # shellcheck disable=SC2086
          docker run --rm --platform linux/arm64 --entrypoint sh arm-test -c "uname -m && $CHECK"
