# Checks every PR into master (Release pipeline step 1). Merging into master
# deploys, so these are what a change has to pass first. Run the same commands
# locally before pushing (AGENTS.md "Checks").
#
# One check per job. Their names (shellcheck, compose, suggester, console,
# boot, bundle, upgrade (stable), upgrade (latest)) are what master's ruleset
# requires, so rename them only together with it.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A new push to the same PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # A pinned shellcheck rather than the runner's, so a runner image update
      # cannot fail a PR that changed nothing. Renovate moves the tag.
      - name: shellcheck every script
        env:
          SHELLCHECK_IMAGE: koalaman/shellcheck:v0.11.0
        run: |
          git ls-files -z '*.sh' scripts/firefly-pocket \
            | xargs -0 docker run --rm -v "$PWD:/mnt:ro" -w /mnt "$SHELLCHECK_IMAGE" -x -P scripts

  compose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      # scripts/config.sh: settings.json against .env.example and compose, and
      # each command, on a copy in a temporary directory.
      - name: The settings store
        run: scripts/config-test.sh

      # A hand-edited .env, as a server set up before the settings store has
      # one, so this also runs gen-secrets.sh the old way (the boot job makes a
      # new server's, through the store). Every value is a throwaway made for
      # this run, including the importer password it prints.
      - name: Make a compose/.env from .env.example
        run: |
          cp compose/.env.example compose/.env
          scripts/gen-secrets.sh

      - name: docker compose config
        run: docker compose --project-directory compose config -q

      # .env.example sets only DOMAIN=example.com. A name set on its own wins
      # (the shell's variables override .env), and with all four set DOMAIN
      # can be empty, as on a server set up before DOMAIN existed.
      - name: The hostnames come from DOMAIN, each overridable
        run: |
          hosts() {
            docker compose --project-directory compose config --format json | jq -r '
              [.services.caddy.environment | .FIREFLY_HOSTNAME, .NEXT_HOSTNAME, .IMPORT_HOSTNAME, .LEGAL_HOSTNAME, .ADMIN_HOSTNAME]
              + [.services.app.environment.APP_URL, .services.next.environment.APP_URL]
              + [.services.importer.environment | .VANITY_URL, .FIREFLY_POCKET_CALLBACK_URL, .FIREFLY_POCKET_APP_URL]
              | join(" ")'
          }
          expect() {
            [ "$1" = "$2" ] || { printf 'expected: %s\n     got: %s\n' "$2" "$1"; exit 1; }
          }
          expect "$(hosts)" "firefly.example.com app.example.com import.example.com legal.example.com admin.example.com https://firefly.example.com https://app.example.com https://firefly.example.com https://app.example.com/eb-callback https://app.example.com"
          expect "$(NEXT_HOSTNAME=next.example.org hosts)" "firefly.example.com next.example.org import.example.com legal.example.com admin.example.com https://firefly.example.com https://next.example.org https://firefly.example.com https://next.example.org/eb-callback https://next.example.org"
          # Without DOMAIN the console has no name until ADMIN_HOSTNAME is set:
          # Caddy serves admin.localhost, from its own CA, and asks no ACME CA.
          expect "$(DOMAIN= FIREFLY_HOSTNAME=f.example.net NEXT_HOSTNAME=n.example.net IMPORT_HOSTNAME=i.example.net LEGAL_HOSTNAME=l.example.net hosts)" "f.example.net n.example.net i.example.net l.example.net admin.localhost https://f.example.net https://n.example.net https://f.example.net https://n.example.net/eb-callback https://n.example.net"
          # A name missing and DOMAIN too: compose cannot refuse that, so the
          # scripts' lib.sh does, and with it the deploy.
          sed -i 's/^DOMAIN=.*/DOMAIN=/' compose/.env
          echo NEXT_HOSTNAME=n.example.net >>compose/.env
          if bash -c 'source scripts/lib.sh' 2>err.txt; then
            echo "lib.sh went on with three names missing and no DOMAIN"; exit 1
          fi
          grep -q 'FATAL: set DOMAIN' err.txt || { cat err.txt; exit 1; }
          echo "derived, overridden, DOMAIN not needed once all four are set, and refused when it is"

      # The setup gate: compose says "done" exactly when the importer has its
      # token, to Caddy and the console alike.
      - name: The setup gate follows the importer's token
        run: |
          # Caddy's alone: the console reads it from the agent's status, so
          # making the account does not start it again.
          gate() {
            docker compose --project-directory compose config --format json \
              | jq -r '[.services.caddy.environment.FIREFLY_POCKET_SETUP, (.services.console.environment.FIREFLY_POCKET_SETUP // "none")] | join(" ")'
          }
          [ "$(IMPORTER_FIREFLY_TOKEN= gate)" = " none" ] || { echo "gated: expected empty, got '$(IMPORTER_FIREFLY_TOKEN= gate)'"; exit 1; }
          [ "$(IMPORTER_FIREFLY_TOKEN=eyJ0x gate)" = "done none" ] || { echo "open: expected done, got '$(IMPORTER_FIREFLY_TOKEN=eyJ0x gate)'"; exit 1; }
          echo "gated without the token, open with it, and the console's environment does not change with it"

  suggester:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      # linux/arm64 runs under QEMU: the image is published for both.
      - uses: docker/setup-qemu-action@v4
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v4

      # The tests run inside the image the server runs, built for each platform
      # it is published for.
      - name: Build the suggester image and run its tests in it
        run: scripts/suggester-test.sh

  # The Firefly Pocket Console's tests, in the image compose runs it on and the
  # way compose runs it: its directory mounted read-only, as an unprivileged
  # user on a read-only root.
  console:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - name: The console's tests
        run: |
          image="$(awk '/^services:/ { s = 1 } s && /^  console:/ { found = 1 } found && /^    image:/ { print $2; exit }' compose/docker-compose.yml)"
          echo "in $image"
          docker run --rm --read-only --user 10001:10001 --tmpfs /tmp \
            -v "$PWD/services/console:/app:ro" -w /app "$image" python -I -B test_console.py

  # The whole stack from scratch, as a new server starts it, checked with the
  # deploy's own smoke test (Release pipeline step 4). On a pin PR this boots
  # the new image before it can reach the server.
  boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      # As cloud-init does on a server: the backups step runs it.
      - name: Install restic
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic

      - name: Boot the stack and run the deploy's smoke test
        run: scripts/boot-test.sh

  # The release bundle this PR would publish once merged (publish.yml), made
  # but not pushed: every image resolves to a digest, and compose accepts the
  # pinned file.
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the version counts the commits since the last release tag

      - name: Assemble the bundle
        run: |
          scripts/make-bundle.sh "$RUNNER_TEMP/bundle"
          cat "$RUNNER_TEMP/bundle/release.json"

      # What the server agent's shadow mode checks on the server, files only:
      # the bundle holds this checkout's files, and only the image lines differ.
      - name: Compare it with the checkout
        run: scripts/agent.sh compare "$RUNNER_TEMP/bundle"

  # A published bundle booted, then upgraded to this commit the way a deploy
  # does it, and checked again (Release pipeline step 8): from stable, what new
  # installs run, and from latest, what your server runs, so the very upgrade
  # this merge would cause there. Before the first release, stable passes with
  # a note.
  upgrade:
    name: upgrade (${{ matrix.from }})
    strategy:
      fail-fast: false
      matrix:
        from: [stable, latest]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      # The boot test of the bundle it starts from runs the backups step.
      - name: Install restic
        run: sudo apt-get update -qq && sudo apt-get install -y -qq restic

      - name: Boot ${{ matrix.from }} and upgrade it to this commit
        env:
          FROM: ${{ matrix.from }}
        run: scripts/upgrade-test.sh
