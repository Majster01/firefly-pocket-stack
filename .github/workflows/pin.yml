# Point a service at a new image, through a PR that merges itself once CI is
# green (scripts/pin-pr.sh). Merging into master is deploying: the server picks
# the commit up within two minutes (scripts/deploy.sh, README "Deploying").
#
# The CI that built the image starts this after pushing it:
#   Majster01/firefly-pocket   main      ->  next       sha-<commit>
#   Majster01/data-importer    fireflyx  ->  importer   <upstream version>-<commit>
#   this repository (suggester.yml)  master  ->  suggester  sha-<commit>
#
# Run it by hand (Actions -> Pin fork image -> Run workflow) to roll back to
# an earlier tag; the "Bump ..." commits in master list them.
#
# It acts as the pin app (README "GitHub settings"): the variable
# PIN_APP_CLIENT_ID and the secret PIN_APP_PRIVATE_KEY. Not GITHUB_TOKEN, because a PR or merge
# made with GITHUB_TOKEN starts no workflows: CI would never run on the PR, so
# it would never merge.
name: Pin fork image
run-name: Pin ${{ inputs.component }} to ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      component:
        description: Service to move
        type: choice
        options: [next, importer, suggester]
      tag:
        description: Image tag in GHCR (sha-abc1234 for Next and the suggester, 2.3.5-abc1234 for the importer)
        type: string
        required: true

# In order, per service. A newer pin replaces one whose PR is still waiting,
# which is right: the newest image wins.
concurrency:
  group: pin-${{ inputs.component }}
  cancel-in-progress: false

# The app's token does the writing.
permissions: {}

jobs:
  pin:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PIN_APP_CLIENT_ID }}
          private-key: ${{ secrets.PIN_APP_PRIVATE_KEY }}

      - uses: actions/checkout@v5
        with:
          ref: master
          token: ${{ steps.app.outputs.token }}

      - name: Pin on pin/${{ inputs.component }} and open a PR that merges itself
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          GH_REPO: ${{ github.repository }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          COMPONENT: ${{ inputs.component }}
          TAG: ${{ inputs.tag }}
        run: |
          # Commit as the app's bot user, so GitHub shows who made the pin.
          bot_id="$(gh api "users/${APP_SLUG}[bot]" --jq .id)"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com"
          scripts/pin-pr.sh "$COMPONENT" "$TAG"
